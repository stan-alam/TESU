<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pituitary Gland Flashcards</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef2ff;
    margin: 0;
    padding: 20px;
    text-align: center;
}

h1 {
    color: #1e3a8a;
}

.instructions {
    color: #555;
    margin-bottom: 20px;
}

.flashcard-container {
    width: 90%;
    max-width: 800px;
    margin: auto;
    perspective: 1000px;
}

.flashcard {
    width: 100%;
    height: 380px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .6s;
    cursor: pointer;
}

.flashcard.flipped {
    transform: rotateY(180deg);
}

.side {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.2);
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    box-sizing: border-box;
}

.front {
    background: white;
    color: #111;
    font-size: 2rem;
    font-weight: bold;
}

.back {
    background: #2563eb;
    color: white;
    transform: rotateY(180deg);
    text-align: left;
    font-size: 1.25rem;
    line-height: 1.6;
}

.controls {
    margin-top: 20px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 20px;
    margin: 5px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
}

button:hover {
    background: #1d4ed8;
}

.progress {
    margin-top: 15px;
    font-weight: bold;
    color: #444;
}
</style>
</head>
<body>

<h1>Pituitary Gland Flashcards</h1>

<div class="instructions">
Click the card or press SPACE to reveal the answer.
</div>

<div class="flashcard-container">
    <div class="flashcard" id="card">
        <div class="side front" id="front"></div>
        <div class="side back" id="back"></div>
    </div>
</div>

<div class="controls">
    <button onclick="prevCard()">⬅ Previous</button>
    <button onclick="shuffleCards()">🔀 Shuffle</button>
    <button onclick="nextCard()">Next ➡</button>
</div>

<div class="progress" id="progress"></div>

<script>

const flashcards = [

{
question: "Growth Hormone (GH)",
answer: `
<b>Pituitary Lobe:</b> Anterior<br><br>
<b>Chemical Class:</b> Protein<br><br>
<b>Effect:</b> Promotes growth of body tissues
`
},

{
question: "Prolactin (PRL)",
answer: `
<b>Pituitary Lobe:</b> Anterior<br><br>
<b>Chemical Class:</b> Peptide<br><br>
<b>Effect:</b> Promotes milk production from mammary glands
`
},

{
question: "Thyroid-Stimulating Hormone (TSH)",
answer: `
<b>Pituitary Lobe:</b> Anterior<br><br>
<b>Chemical Class:</b> Glycoprotein<br><br>
<b>Effect:</b> Stimulates thyroid hormone release from the thyroid gland
`
},

{
question: "Adrenocorticotropic Hormone (ACTH)",
answer: `
<b>Pituitary Lobe:</b> Anterior<br><br>
<b>Chemical Class:</b> Peptide<br><br>
<b>Effect:</b> Stimulates hormone release by the adrenal cortex
`
},

{
question: "Follicle-Stimulating Hormone (FSH)",
answer: `
<b>Pituitary Lobe:</b> Anterior<br><br>
<b>Chemical Class:</b> Glycoprotein<br><br>
<b>Effect:</b> Stimulates gamete production in gonads
`
},

{
question: "Luteinizing Hormone (LH)",
answer: `
<b>Pituitary Lobe:</b> Anterior<br><br>
<b>Chemical Class:</b> Glycoprotein<br><br>
<b>Effect:</b> Stimulates androgen production by gonads
`
},

{
question: "Antidiuretic Hormone (ADH)",
answer: `
<b>Pituitary Lobe:</b> Posterior<br><br>
<b>Chemical Class:</b> Peptide<br><br>
<b>Effect:</b> Stimulates water reabsorption by kidneys
`
},

{
question: "Oxytocin",
answer: `
<b>Pituitary Lobe:</b> Posterior<br><br>
<b>Chemical Class:</b> Peptide<br><br>
<b>Effect:</b> Stimulates uterine contractions during childbirth
`
},

{
question: "Melanocyte-Stimulating Hormone (MSH)",
answer: `
<b>Pituitary Lobe:</b> Intermediate Zone<br><br>
<b>Chemical Class:</b> Peptide<br><br>
<b>Effect:</b> Stimulates melanin formation in melanocytes
`
}

];

let current = 0;

const card = document.getElementById("card");
const front = document.getElementById("front");
const back = document.getElementById("back");
const progress = document.getElementById("progress");

function loadCard() {
    front.innerHTML = flashcards[current].question;
    back.innerHTML = flashcards[current].answer;
    card.classList.remove("flipped");
    progress.innerHTML =
        `Card ${current + 1} of ${flashcards.length}`;
}

function nextCard() {
    current = (current + 1) % flashcards.length;
    loadCard();
}

function prevCard() {
    current = (current - 1 + flashcards.length) % flashcards.length;
    loadCard();
}

function shuffleCards() {
    for (let i = flashcards.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [flashcards[i], flashcards[j]] =
        [flashcards[j], flashcards[i]];
    }
    current = 0;
    loadCard();
}

card.addEventListener("click", () => {
    card.classList.toggle("flipped");
});

document.addEventListener("keydown", e => {

    if (e.code === "Space") {
        e.preventDefault();
        card.classList.toggle("flipped");
    }

    if (e.key === "ArrowRight") {
        nextCard();
    }

    if (e.key === "ArrowLeft") {
        prevCard();
    }

});

loadCard();

</script>

</body>
</html>
