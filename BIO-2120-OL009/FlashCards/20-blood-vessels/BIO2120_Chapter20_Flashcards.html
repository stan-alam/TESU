<!DOCTYPE html><html><head><meta charset="UTF-8"><title>BIO2120 Chapter 20 Flashcards</title><style>body{font-family:Arial;margin:20px;background:#eef2f7}#card{background:white;max-width:950px;margin:auto;padding:25px;border-radius:12px;box-shadow:0 2px 10px #999;min-height:420px}button{padding:10px 16px;margin:5px}#controls{text-align:center;margin-top:15px}</style></head><body><h1>BIO 2120 Chapter 20 Review Flashcards</h1><div id="card"></div><div id="controls"><button onclick="prev()">Previous</button><button onclick="flip()">Flip</button><button onclick="next()">Next</button></div><script>const cards=[{q:`The endothelium is found in the:<br>A. Tunica intima<br>B. Tunica media<br>C. Tunica externa<br>D. Lumen`,a:`<b>Correct: A. Tunica intima</b><p>Endothelium lines blood vessels and forms the innermost layer.</p><p>B wrong: tunica media contains smooth muscle.</p><p>C wrong: tunica externa is outer connective tissue.</p><p>D wrong: lumen is the vessel space.</p>`},{q:`Nervi vasorum control:<br>A Vasoconstriction only<br>B Vasodilation only<br>C Capillary permeability<br>D Both vasoconstriction and vasodilation`,a:`<b>Correct: D</b><p>They regulate vessel diameter in both directions.</p><p>A/B wrong because not exclusively one direction.</p><p>C wrong because they do not primarily regulate capillary permeability.</p>`},{q:`Closer to the heart arteries have more:<br>A Endothelium<br>B Smooth muscle fibers<br>C Elastic fibers<br>D Collagen fibers`,a:`<b>Correct: C Elastic fibers</b><p>Elastic arteries stretch and recoil.</p>`},{q:`Which best describes veins?<br>A Thick walls small lumen low pressure no valves<br>B Thin walls large lumens low pressure have valves<br>C Thin walls small lumens high pressure have valves<br>D Thick walls large lumens high pressure`,a:`<b>Correct: B</b><p>Veins are low-pressure vessels with valves.</p>`},{q:`Especially leaky capillary in liver:<br>A capillary bed<br>B fenestrated<br>C sinusoid<br>D metarteriole`,a:`<b>Correct: C sinusoid</b><p>Large gaps allow proteins and cells through.</p>`},{q:`In BP 110/70, 70 is:<br>A systolic<br>B diastolic<br>C pulse pressure<br>D mean arterial`,a:`<b>Correct: B diastolic pressure</b>`},{q:`Healthy elastic artery:<br>A is compliant<br>B reduces flow<br>C resistance artery<br>D thin wall`,a:`<b>Correct: A</b><p>Compliance allows stretch and recoil.</p>`},{q:`True statement?<br>A Longer vessel lower resistance<br>B Lower blood volume lowers BP and flow<br>C Increased viscosity increases flow<br>D All`,a:`<b>Correct: B</b><p>A and C are physiologically opposite.</p>`},{q:`Slight vasodilation causes:<br>A slight increase resistance<br>B huge increase resistance<br>C slight decrease resistance<br>D huge decrease resistance`,a:`<b>Correct: D</b><p>Poiseuille's law: radius strongly affects resistance.</p>`},{q:`Venoconstriction increases:<br>A venous pressure<br>B venous flow<br>C return to heart<br>D all above`,a:`<b>Correct: D</b>`},{q:`Hydrostatic pressure is:<br>A greater than COP at venous end<br>B pressure exerted by fluid in enclosed space<br>C zero at midpoint<br>D all`,a:`<b>Correct: B</b><p>A and C are false.</p>`},{q:`Net filtration pressure:<br>A CHP+IFHP<br>B subtract lymph flow<br>C CHP+BCOP<br>D CHP-BCOP`,a:`<b>Correct: D</b>`},{q:`Which is true?<br>A More filtered than reabsorbed per day<br>B 35mm filtered 7mm reabsorbed<br>C lymphatics absorb 20.4L/day<br>D none`,a:`<b>Correct: A</b>`},{q:`Medulla neurons regulating BP are:<br>A baroreceptors<br>B angioreceptors<br>C cardiomotor mechanism<br>D cardiovascular center`,a:`<b>Correct: D</b>`},{q:`Aldosterone causes kidneys to:<br>A release renin from liver<br>B increase urine output<br>C reabsorb sodium<br>D all`,a:`<b>Correct: C</b>`},{q:`Myogenic response involves:<br>A muscle pump<br>B reduced ventricular strength<br>C vascular smooth muscle responds to stretch<br>D endothelins dilate arteries`,a:`<b>Correct: C</b>`},{q:`Shock from severe diarrhea/vomiting:<br>A hypovolemic<br>B anaphylactic<br>C obstructive<br>D hemorrhagic`,a:`<b>Correct: A</b>`},{q:`Coronary arteries branch from:<br>A aortic valve<br>B ascending aorta<br>C aortic arch<br>D thoracic aorta`,a:`<b>Correct: B</b>`},{q:`True statement:<br>A both carotids from brachiocephalic trunk<br>B brachial artery continuation of axillary artery<br>C radial and ulnar form palmar arch<br>D all`,a:`<b>Correct: C</b><p>A is false so D cannot be correct.</p>`},{q:`Arteries to stomach pancreas liver arise from:<br>A superior mesenteric<br>B inferior mesenteric<br>C celiac trunk<br>D splenic`,a:`<b>Correct: C</b>`},{q:`Brachiocephalic veins:<br>A receive jugular drainage<br>B receive subclavian drainage<br>C drain to SVC<br>D all`,a:`<b>Correct: D</b>`},{q:`Hepatic portal system delivers blood to:<br>A liver<br>B hypothalamus<br>C spleen<br>D left atrium`,a:`<b>Correct: A</b>`},{q:`Blood islands are:<br>A placental filters<br>B stem cell masses in marrow<br>C vascular tubes forming heart<br>D embryonic masses of developing vessels and blood elements`,a:`<b>Correct: D</b>`},{q:`Umbilical vein carries:<br>A oxygen-poor blood to placenta<br>B oxygen-rich blood from placenta to fetus<br>C deoxygenated blood to lungs<br>D none`,a:`<b>Correct: B</b>`},{q:`Ductus venosus allows:<br>A RA to LA flow<br>B RV to LV flow<br>C freshly oxygenated blood toward heart<br>D oxygen-poor blood to pulmonary trunk`,a:`<b>Correct: C</b>`}];let i=0,f=false;function render(){document.getElementById('card').innerHTML=(f?cards[i].a:cards[i].q)+'<hr>Card '+(i+1)+' of '+cards.length;}function flip(){f=!f;render()}function next(){i=(i+1)%cards.length;f=false;render()}function prev(){i=(i-1+cards.length)%cards.length;f=false;render()}render();</script></body></html>
